services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: arturoalvarez/fuego-dance:latest
    container_name: fuego-dance-app
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///./db/fuego_dance.db
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_GRAPH_API_VERSION: ${INSTAGRAM_GRAPH_API_VERSION:-v23.0}
      INSTAGRAM_GRAPH_API_HOST: ${INSTAGRAM_GRAPH_API_HOST:-graph.instagram.com}
    volumes:
      - /home/artulita/fuegodance:/app/uploads
      - fuego-db:/app/db
    ports:
      - "8083:8000"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M

volumes:
  fuego-db:
