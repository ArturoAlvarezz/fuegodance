# Stack de Fuego Dance. El workflow de CI/CD (.github/workflows/ci-cd.yml) lo copia a /opt/stacks/fuego-dance-app
# (producción) o /opt/stacks/fuego-dance-app-pruebas y lo levanta con IMAGEN, CONTENEDOR y PUERTO definidos.
# Producción usa los datos de siempre (rutas en su .env); pruebas usa ./data, sin tocar los de producción.
services:
  app:
    image: ${IMAGEN:?IMAGEN no definida}
    container_name: ${CONTENEDOR:?CONTENEDOR no definido}
    restart: unless-stopped
    # Red bridge de Docker: un solo contenedor no necesita red propia, y la VM tiene un número limitado de redes.
    network_mode: bridge
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./db/fuego_dance.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en .env}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_GRAPH_API_VERSION: ${INSTAGRAM_GRAPH_API_VERSION:-v23.0}
      INSTAGRAM_GRAPH_API_HOST: ${INSTAGRAM_GRAPH_API_HOST:-graph.instagram.com}
    volumes:
      - ${SUBIDAS:-./data/uploads}:/app/uploads
      - ${INSTAGRAM:-./data/instagram}:/app/uploads/instagram
      - ${BASE:-./data/db}:/app/db
    ports:
      - "127.0.0.1:${PUERTO:?PUERTO no definido}:8000"
    labels:
      com.centurylinklabs.watchtower.enable: "false" # la imagen es local; la actualiza el CI/CD, no Watchtower
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M
